name: Build kkfileview main

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docker/kkfileview-base/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Maven build
        run: mvn -B clean package -DskipTests
        working-directory: server

      - name: Verify artifact
        run: |
          ls -la server/target/kkFileView-*.tar.gz || (echo "Build failed: no tar.gz" && exit 1)

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from pom
        id: version
        run: |
          VER=$(grep -m1 '<version>' server/pom.xml | head -1 | sed -E 's/.*<version>([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build & push main image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/kkfileview-base:5.0.0
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kkfileview:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kkfileview:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max