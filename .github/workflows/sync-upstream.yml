name: Sync upstream kkFileView

on:
  schedule:
    # 每天 UTC 02:00 检查上游更新（cron 表达式）
    - cron: '0 2 * * *'
  workflow_dispatch:    # 手动触发
  repository_dispatch:  # 留作以后自动触发扩展

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream master into fork master
        run: |
          # 加 upstream remote（如果不在）
          if ! git remote get-url upstream > /dev/null 2>&1; then
            git remote add upstream https://github.com/kekingcn/kkFileView.git
          fi
          git fetch upstream master

          # 看上游有没有新 commit
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/master)

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "Already in sync, no-op."
            exit 0
          fi

          # 检查是否会 fast-forward
          MERGE_BASE=$(git merge-base HEAD upstream/master)
          if [ "$MERGE_BASE" = "$LOCAL" ]; then
            echo "Can fast-forward, doing it."
            git merge --ff-only upstream/master
          else
            # fork 已经有自己的提交，尝试 rebase
            echo "Cannot fast-forward, attempting rebase."
            git rebase upstream/master || {
              echo "Rebase failed - manual intervention required."
              exit 1
            }
          fi

      - name: Push sync to fork
        run: |
          git push origin master

      - name: Trigger downstream build-main workflow
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // 同步成功后，触发 build-main workflow（如果有新 commit）
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-main.yml',
              ref: 'master'
            });
            console.log('Triggered build-main workflow');